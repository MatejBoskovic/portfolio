<body class="ladica-page">
    <!-- Full browser viewport width header -->
    <header>
        <nav class="desktop-nav">
            <a href="index.html" class="nav-btn" id="nav-radovi">
                <img src="assets/nav_radovi.png" alt="radovi">

            <a href="kontakt.html" class="nav-btn" id="nav-kontakt">
                <img src="assets/nav_kontakt.png" alt="kontakt">
            </a>
            <a href="ladica.html" class="nav-btn active" id="nav-ladica">
                <img src="assets/nav_ladica.jpg" alt="ladica">
            </a>
        </nav>
        <div class="bio-text">matej (anđelko) 
bošković je 
(grafički) dizajner 
koji živi i radi u 
rijeci</div>
        <button class="mobile-hamburger-btn" id="mobile-menu-btn" aria-label="Open menu">
            <img src="assets/hamburger_menu.jpg" alt="Menu">
        </button>

    <div class="mobile-menu-overlay" id="mobile-menu-overlay">

                <img src="assets/nav_radovi.png" alt="radovi">

        <div class="ladica-item" data-index="1"
             style="left:4%; top:2%; --rot:-6deg;">
            <video src="assets/ladica_01.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Item 2: video 02 — portrait -->
        <div class="ladica-item" data-index="2"
             style="left:24%; top:1%; --rot:4deg;">
            <video src="assets/ladica_02.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Item 3: png illustration — landscape -->
        <div class="ladica-item" data-index="3"
             style="left:42%; top:3%; --rot:-3deg;">
            <img src="assets/ladica_03.png" alt="">
        </div>

        <!-- Item 4: video 04 -->
        <div class="ladica-item" data-index="4"
             style="left:63%; top:0%; --rot:5deg;">
            <video src="assets/ladica_04.mp4" autoplay loop muted playsinline></video>
        </div>

        <!-- Item 5: landscape photo -->
        <div class="ladica-item" data-index="5"
             style="left:2%; top:42%; --rot:3deg;">
            <img src="assets/ladica_05.jpg" alt="">

        <!-- Item 6: portrait photo -->
        <div class="ladica-item" data-index="6"
             style="left:20%; top:32%; --rot:-8deg;">
            <img src="assets/ladica_06.jpg" alt="">

        <div class="ladica-item" data-index="9"
             style="left:5%; top:68%; --rot:2deg;">
            <img src="assets/ladica_09.jpg" alt="">
        </div>

        <!-- Item 10: wide photo -->
        <div class="ladica-item" data-index="10"
             style="left:32%; top:62%; --rot:-5deg;">
            <img src="assets/ladica_10.jpg" alt="">

        <!-- Item 11: portrait photo -->
        <div class="ladica-item" data-index="11"
             style="left:68%; top:52%; --rot:7deg;">
            <img src="assets/ladica_11.jpg" alt="">
        </div>

        <p class="ladica-caption">manji projekti, ilustracije, fotke, grafike, pokušaji i skice</p>

    <!-- Lightbox overlay -->
    <div id="ladica-lightbox" aria-hidden="true">
        <button id="ladica-lightbox-close" aria-label="Zatvori"><img src="assets/x.jpg" alt="zatvori"></button>
        <div id="ladica-lightbox-media"></div>
    </div>

    <script src="script.js"></script>
    <script src="ladica.js"></script>
